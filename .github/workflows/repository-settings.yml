# ABOUTME: Audits GitHub repository settings against the first-party CI/CD hardening contract.
# ABOUTME: Runs scheduled/manual drift checks and retains redacted repository-settings evidence.

name: Repository Settings Drift

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: read

on:
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-settings:
    name: Repository Settings Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate repository settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RestorePackagesWithLockFile: "false"
        run: dotnet run .ci/scripts/validate-repository-settings.cs -- "${GITHUB_REPOSITORY}" artifacts/repository-settings

      - name: Upload repository settings evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-settings-evidence
          path: artifacts/repository-settings/**
          if-no-files-found: warn
          retention-days: 30
